services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - ./ml/models:/app/ml/models:ro
      - ./ml/data:/app/ml/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped